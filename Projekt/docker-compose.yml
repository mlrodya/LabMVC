services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - biblioteka_data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__BibliotekaConnection=Data Source=/app/data/Biblioteka.db

volumes:
  biblioteka_data:
